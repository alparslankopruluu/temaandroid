name: ScreenMotion
options:
  bundleIdPrefix: com.screenmotion
  deploymentTarget:
    iOS: '17.0'
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.17.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.83.2
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: UYDAF6RY67
    REVENUECAT_API_KEY: appl_TmvNHRdUtFCFHyWJpURYkkAyCQe
    MARKETING_VERSION: '1.0.4'
    CURRENT_PROJECT_VERSION: '11'
  configs:
    Debug:
      FIREBASE_CONFIG_ENV: dev
      REMOTE_CONTENT_MANIFEST_URL: https://screenmotion-dev.web.app/v2/manifest.json
    Release:
      FIREBASE_CONFIG_ENV: prod
      REMOTE_CONTENT_MANIFEST_URL: https://screenmotion-prod.web.app/v2/manifest.json
targets:
  ScreenMotion:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Resources, Config]
      - path: App/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenmotion.studio
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/ScreenMotion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: $(inherited) -ObjC
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    dependencies:
      - target: ScreenMotionWidgets
      - package: RevenueCat
        product: RevenueCat
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseMessaging
    postBuildScripts:
      - name: Copy Firebase configuration
        script: |
          set -eu
          source_plist="${SRCROOT}/App/Config/${FIREBASE_CONFIG_ENV}/GoogleService-Info.plist"
          test -f "$source_plist" || { echo "Missing Firebase configuration for ${FIREBASE_CONFIG_ENV}" >&2; exit 1; }
          cp "$source_plist" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
        basedOnDependencyAnalysis: false
      - name: Upload Crashlytics symbols
        script: |
          set -eu
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
        inputFiles:
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(EXECUTABLE_NAME)
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        basedOnDependencyAnalysis: false
  ScreenMotionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: App/Services/WidgetBridge.swift
        optional: true
      - path: App/Resources/Localizable.xcstrings
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenmotion.studio.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION
        APPLICATION_EXTENSION_API_ONLY: YES
  ScreenMotionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ScreenMotion
  ScreenMotionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ScreenMotion
schemes:
  ScreenMotion:
    build:
      targets:
        ScreenMotion: all
    run:
      config: Debug
      storeKitConfiguration: App/Resources/Products.storekit
    test:
      testPlans:
        - path: ScreenMotion.xctestplan
          defaultPlan: true
      targets: [ScreenMotionTests, ScreenMotionUITests]
