name: ScreenMotion
options:
  bundleIdPrefix: com.screenmotion
  deploymentTarget:
    iOS: '17.0'
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.83.2
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: UYDAF6RY67
    REVENUECAT_API_KEY: appl_TmvNHRdUtFCFHyWJpURYkkAyCQe
targets:
  ScreenMotion:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Resources]
      - path: App/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenmotion.studio
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/ScreenMotion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ScreenMotionWidgets
      - package: RevenueCat
        product: RevenueCat
  ScreenMotionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: App/Services/WidgetBridge.swift
        optional: true
      - path: App/Resources/Localizable.xcstrings
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenmotion.studio.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION
        APPLICATION_EXTENSION_API_ONLY: YES
  ScreenMotionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ScreenMotion
  ScreenMotionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ScreenMotion
schemes:
  ScreenMotion:
    build:
      targets:
        ScreenMotion: all
    run:
      config: Debug
      storeKitConfiguration: App/Resources/Products.storekit
    test:
      testPlans:
        - path: ScreenMotion.xctestplan
          defaultPlan: true
      targets: [ScreenMotionTests, ScreenMotionUITests]
